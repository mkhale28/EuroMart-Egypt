version: '3.8'

services:
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: euromart-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - redis
    networks:
      - euromart

  web:
    image: nginx:1.26-alpine
    container_name: euromart-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - euromart

  db:
    image: mysql:8.4
    container_name: euromart-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: euromart
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: euromart
    ports:
      - "3306:3306"
    volumes:
      - euromart-db:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - euromart

  redis:
    image: redis:7.4-alpine
    container_name: euromart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - euromart-redis:/data
    networks:
      - euromart

  queue:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: euromart-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ../:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - app
      - redis
      - db
    networks:
      - euromart

  scheduler:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: euromart-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ../:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - app
      - redis
      - db
    networks:
      - euromart

  npm:
    image: node:22-alpine
    container_name: euromart-npm
    working_dir: /var/www
    volumes:
      - ../:/var/www
    entrypoint: ['npm']

volumes:
  euromart-db:
    driver: local
  euromart-redis:
    driver: local

networks:
  euromart:
    driver: bridge
